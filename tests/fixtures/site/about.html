<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About — GitQi Test Site</title>
  <meta name="description" content="About page of the fixture site.">

  <style>
    /* Mirror of index.html's CSS variables — the sync code propagates
       any edits made to the main <style> block from one page to all
       others, so this block will be overwritten when sync fires. */
    :root {
      --color-primary:    #1a1b3a;
      --color-secondary:  #3d3e7a;
      --color-accent:     #ffb627;
      --color-bg:         #ffffff;
      --color-bg-alt:     #f5f5fa;
      --color-text:       #333333;
      --color-text-muted: #666666;

      --font-heading: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-size-base: 1rem;
      --line-height-base: 1.6;

      --space-xs:  0.25rem;
      --space-sm:  0.5rem;
      --space-md:  1rem;
      --space-lg:  2rem;
      --space-xl:  4rem;

      --container-width: 1100px;
      --radius:          0.375rem;
      --shadow:          0 2px 12px rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-body);
      font-size: var(--font-size-base);
      line-height: var(--line-height-base);
      color: var(--color-text);
      background: var(--color-bg);
    }
    nav {
      padding: var(--space-md) var(--space-lg);
      background: var(--color-bg-alt);
    }
    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      gap: var(--space-md);
    }
    nav a { color: var(--color-primary); text-decoration: none; font-weight: 600; }
    nav a.active { color: var(--color-accent); }
    section {
      max-width: var(--container-width);
      margin: 0 auto;
      padding: var(--space-xl) var(--space-lg);
    }
    h1, h2 { font-family: var(--font-heading); color: var(--color-primary); margin: 0 0 var(--space-md); }
    h1 { font-size: 2.5rem; }
    h2 { font-size: 1.75rem; }
    p  { margin: 0 0 var(--space-md); }
    footer {
      background: var(--color-primary);
      color: var(--color-bg);
      padding: var(--space-lg);
      text-align: center;
    }
    footer a { color: var(--color-accent); }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html" class="active">About</a></li>
    </ul>
  </nav>

  <main>
    <section data-zone="hero" data-zone-label="Hero">
      <h1 data-editable>About Us</h1>
      <p data-editable>The about page in the fixture site.</p>
    </section>
  </main>

  <footer data-zone="footer" data-zone-label="Footer">
    <p data-editable>&copy; Test Site. Built with GitQi.</p>
  </footer>

  <script src="/gitqi.js"></script>
</body>
</html>
